<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img">
  <title>One Discord timestamp shown in New York, London and Sydney time</title>
  <rect width="640" height="400" rx="18" fill="#14151e"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="44" font-size="15" font-weight="600" fill="#a4a8bd">ONE CODE</text>
    <rect x="24" y="58" width="592" height="56" rx="12" fill="#1b1d29" stroke="#2a2c3c"/>
    <text x="320" y="93" font-size="20" fill="#5eead4" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">&lt;t:1793740800:F&gt;</text>

    <text x="32" y="150" font-size="15" font-weight="600" fill="#a4a8bd">THREE VIEWERS, EACH IN THEIR OWN TIME</text>

    <rect x="24" y="164" width="592" height="64" rx="12" fill="#1b1d29"/>
    <text x="44" y="190" font-size="13" fill="#a4a8bd">New York (EST)</text>
    <text x="44" y="214" font-size="18" fill="#ececf4">Tuesday, November 3, 2026 at 4:20 PM</text>

    <rect x="24" y="238" width="592" height="64" rx="12" fill="#1b1d29"/>
    <text x="44" y="264" font-size="13" fill="#a4a8bd">London (GMT)</text>
    <text x="44" y="288" font-size="18" fill="#ececf4">Tuesday, November 3, 2026 at 9:20 PM</text>

    <rect x="24" y="312" width="592" height="64" rx="12" fill="#1b1d29"/>
    <text x="44" y="338" font-size="13" fill="#a4a8bd">Sydney (AEDT)</text>
    <text x="44" y="362" font-size="18" fill="#ececf4">Wednesday, November 4, 2026 at 8:20 AM</text>
  </g>
</svg>
